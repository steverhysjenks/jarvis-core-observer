# Include as the top-level rest: list. Never put the token here.
- resource: http://192.168.0.62:8000/nutrition/summary/today
  method: GET
  scan_interval: 180
  timeout: 25
  headers:
    Authorization: !secret jarvis_nutrition_summary_authorization
  sensor:
    - name: Sparky Daily Calorie Goal
      unique_id: jarvis_sparky_daily_calorie_goal
      unit_of_measurement: "kcal"
      state_class: measurement
      value_template: "{{ value_json.get('goal_kcal') }}"
      availability: "{{ value_json is defined and value_json.get('status') == 'valid' and value_json.get('goal_kcal') is number and (as_timestamp(now()) - as_timestamp(value_json.get('updated_at'), 0)) < 240 and value_json.get('date') == now().strftime('%Y-%m-%d') }}"
      json_attributes:
        - date
        - updated_at
        - status
        - has_entries
    - name: Sparky Calories Consumed
      unique_id: jarvis_sparky_calories_consumed
      unit_of_measurement: "kcal"
      state_class: measurement
      value_template: "{{ value_json.get('consumed_kcal') }}"
      availability: "{{ value_json is defined and value_json.get('status') == 'valid' and value_json.get('consumed_kcal') is number and (as_timestamp(now()) - as_timestamp(value_json.get('updated_at'), 0)) < 240 and value_json.get('date') == now().strftime('%Y-%m-%d') }}"
      json_attributes:
        - date
        - updated_at
        - status
        - has_entries
    - name: Sparky Calories Remaining
      unique_id: jarvis_sparky_calories_remaining
