      value_template: "{{ value_json.get('remaining_kcal') }}"
      availability: "{{ value_json is defined and value_json.get('status') == 'valid' and value_json.get('remaining_kcal') is number and (as_timestamp(now()) - as_timestamp(value_json.get('updated_at'), 0)) < 240 and value_json.get('date') == now().strftime('%Y-%m-%d') }}"
