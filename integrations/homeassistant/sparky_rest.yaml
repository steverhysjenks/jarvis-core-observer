    - name: Sparky Calorie Progress
      unique_id: jarvis_sparky_calorie_progress
      unit_of_measurement: "%"
      state_class: measurement
      value_template: "{{ value_json.get('progress_percent') }}"
      availability: "{{ value_json is defined and value_json.get('status') == 'valid' and value_json.get('progress_percent') is number and (as_timestamp(now()) - as_timestamp(value_json.get('updated_at'), 0)) < 240 and value_json.get('date') == now().strftime('%Y-%m-%d') }}"
      json_attributes:
        - date
