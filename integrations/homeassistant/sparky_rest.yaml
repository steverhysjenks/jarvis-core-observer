- resource: http://192.168.0.62:8000/nutrition/summary/history
  method: GET
  scan_interval: 7200
  timeout: 25
  headers:
    Authorization: !secret jarvis_nutrition_summary_authorization
  sensor:
    - name: Sparky 14 Day Average Calories
      unique_id: jarvis_sparky_14_day_average_calories
      unit_of_measurement: "kcal"
      state_class: measurement
      value_template: "{{ value_json.get('average_logged_day_kcal') }}"
      availability: "{{ value_json is defined and value_json.get('status') == 'valid' and value_json.get('average_logged_day_kcal') is number and (as_timestamp(now()) - as_timestamp(value_json.get('updated_at'), 0)) < 7300 }}"
      json_attributes:
        - timezone
        - window_days
        - start_date
        - end_date
        - updated_at
        - status
        - average_includes_today
        - completed_logged_days
        - today_kcal
    - name: Sparky 14 Day Logged Days
      unique_id: jarvis_sparky_14_day_logged_days
      unit_of_measurement: "days"
      state_class: measurement
      value_template: "{{ value_json.get('logged_days') }}"
      availability: "{{ value_json is defined and value_json.get('status') == 'valid' and value_json.get('logged_days') is number and (as_timestamp(now()) - as_timestamp(value_json.get('updated_at'), 0)) < 7300 }}"
      json_attributes:
        - timezone
        - window_days
        - start_date
        - end_date
        - updated_at
        - status
        - average_includes_today
        - completed_logged_days
        - today_kcal
        - days
