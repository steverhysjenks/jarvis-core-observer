        - has_entries
    - name: Sparky Protein Consumed
      unique_id: jarvis_sparky_protein_consumed
      unit_of_measurement: "g"
      state_class: measurement
      value_template: "{{ value_json.get('protein_g') }}"
      availability: "{{ value_json is defined and value_json.get('status') == 'valid' and value_json.get('protein_g') is number and (as_timestamp(now()) - as_timestamp(value_json.get('updated_at'), 0)) < 240 and value_json.get('date') == now().strftime('%Y-%m-%d') }}"
      json_attributes:
        - date
        - updated_at
        - status
        - has_entries
    - name: Sparky Carbs Consumed
      unique_id: jarvis_sparky_carbs_consumed
      unit_of_measurement: "g"
      state_class: measurement
      value_template: "{{ value_json.get('carbs_g') }}"
      availability: "{{ value_json is defined and value_json.get('status') == 'valid' and value_json.get('carbs_g') is number and (as_timestamp(now()) - as_timestamp(value_json.get('updated_at'), 0)) < 240 and value_json.get('date') == now().strftime('%Y-%m-%d') }}"
