# Validation/tests remain offline. CD is manual and only available on protected main.
stages:
  - validate
  - test
  - package
  - deploy

variables:
  JARVIS_OPERATION: deploy

default:
  image: python:3.13-slim
  tags:
    - docker
  before_script:
    - python --version
    - python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
    - python -m pip check

validate:
  stage: validate
  timeout: 10m
  script:
    - python -B ci/validate.py --ci
    - python -B ci/test_deployment.py --junitxml results/deployment-units.xml
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - results/deployment-units.xml
    reports:
      junit: results/deployment-units.xml

regression:
  stage: test
  dependencies: []
  timeout: 10m
  script:
    - python -B ci/validate.py --ci
    - python -B ci/run_offline.py
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - results/*.xml
    reports:
      junit: results/*.xml

package_release:
  stage: package
  timeout: 5m
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git ca-certificates
  needs:
    - validate
    - regression
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never
  script:
    - python -B ci/package_release.py
  artifacts:
    expire_in: 7 days
    paths:
      - release-artifacts/

.cd:
  stage: deploy
  timeout: 40m
  interruptible: false
  resource_group: jarvis-core-lxc122
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends openssh-client git ca-certificates
  needs:
    - job: package_release
      artifacts: true
    - validate
    - regression
  environment:
    name: production
    deployment_tier: production
  allow_failure: false

production_preflight:
  extends: .cd
  environment:
    name: production
    deployment_tier: production
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web" && $JARVIS_OPERATION == "preflight"'
      when: manual
    - when: never
  script:
    - python -B ci/deploy.py preflight

bootstrap_production:
  extends: .cd
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web" && $JARVIS_OPERATION == "bootstrap"'
      when: manual
    - when: never
  script:
    - python -B ci/deploy.py bootstrap

deploy_production:
  extends: .cd
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $JARVIS_OPERATION == "deploy"'
      when: manual
    - when: never
  script:
    - python -B ci/deploy.py deploy